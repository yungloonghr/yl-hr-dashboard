<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人資部紀錄・匯報中心</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--text:#263743;--muted:#7d8b96;--line:#e3e9ed;--green:#789f8b;--greenbg:#eaf3ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1250px;margin:auto;padding:26px}h1{font-size:25px;margin:0 0 5px}.sub{font-size:12px;color:var(--muted)}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}a,button{border:1px solid var(--line);background:#fff;color:#56646f;border-radius:9px;padding:9px 12px;text-decoration:none;cursor:pointer}.primary{background:var(--green);color:#fff;border-color:var(--green)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}.filters{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end}label{display:block;font-size:11px;color:#74828d;margin-bottom:5px}select,input{width:100%;border:1px solid #dce4e8;border-radius:9px;padding:10px;background:#fff}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:#fafbfc;border:1px solid #edf1f3;border-radius:12px;padding:13px}.stat span{font-size:11px;color:var(--muted)}.stat b{display:block;font-size:23px;margin-top:4px}.report{line-height:1.75}.report h3{font-size:15px;margin:20px 0 8px}.report ul{margin:5px 0;padding-left:22px}.empty{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:760px){.wrap{padding:14px}.filters,.stats{grid-template-columns:1fr}}
@media print{body{background:#fff}.top a,.filters,.actions{display:none}.card{border:0;padding:0}.wrap{max-width:none}}
</style></head><body><div class="wrap"><div class="top"><div><h1>紀錄・匯報中心</h1><div class="sub">依人員與期間整理工作紀錄，產生個人工作匯報</div></div><a href="index.html">返回儀表板</a></div>
<div class="card"><div class="filters"><div><label>匯報人員</label><select id="person"><option>柔安</option><option selected>于瑄</option><option>蓁蓁</option><option>昱菱</option></select></div><div><label>開始日期</label><input id="start" type="date"></div><div><label>結束日期</label><input id="end" type="date"></div><button id="generate" class="primary">產生匯報</button></div></div>
<div class="card"><div id="stats" class="stats"></div></div>
<div class="card"><div id="report" class="report"></div><div class="actions"><button id="print">列印 / PDF</button><button id="copy">複製匯報文字</button></div></div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";import{getFirestore,doc,getDoc,collection,getDocs,query,where,orderBy}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const firebaseConfig={
 apiKey:"AIzaSyBjwYdXHp4qTdZKhh4Nd7recLkuQzJlZNs",
 authDomain:"yl-hr-dashboard.firebaseapp.com",
 projectId:"yl-hr-dashboard",
 storageBucket:"yl-hr-dashboard.firebasestorage.app",
 messagingSenderId:"563879035782",
 appId:"1:563879035782:web:77f8fd059b23efb633e207"
};
const app=initializeApp(firebaseConfig),db=getFirestore(app),ref=doc(db,"dashboard","main");let data={tasks:[],adhoc:[],blockers:[],projects:[]};
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let now=new Date(),day=now.getDay()||7,monday=new Date(now);monday.setDate(now.getDate()-day+1);$("start").value=monday.toISOString().slice(0,10);$("end").value=now.toISOString().slice(0,10);
async function load(){let s=await getDoc(ref);if(s.exists())data=s.data();generate()}
function inRange(x,s,e){let d=x.date||"";return !d||(d>=s&&d<=e)}
function generate(){let p=$("person").value,s=$("start").value,e=$("end").value;let tasks=(data.tasks||[]).filter(x=>x.person===p&&inRange(x,s,e)),ad=(data.adhoc||[]).filter(x=>x.person===p&&inRange(x,s,e)),bl=(data.blockers||[]).filter(x=>x.person===p&&inRange(x,s,e)),projects=(data.projects||[]).filter(x=>(x.owner||"").includes(p));let done=tasks.filter(x=>x.status==="已完成"),doing=tasks.filter(x=>x.status!=="已完成");$("stats").innerHTML=[["工作項目",tasks.length],["完成",done.length],["進行/待處理",doing.length],["臨時交付",ad.length],["卡關",bl.length]].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("");let list=a=>a.length?`<ul>${a.map(x=>`<li>${esc(x.title)}</li>`).join("")}</ul>`:'<div class="empty">無</div>';$("report").innerHTML=`<h2>${esc(p)}｜工作匯報</h2><div class="sub">期間：${s} ～ ${e}</div><h3>一、本期完成事項</h3>${list(done)}<h3>二、持續進行 / 待處理</h3>${list(doing)}<h3>三、臨時交付事項</h3>${ad.length?`<ul>${ad.map(x=>`<li>${esc(x.title)}｜交付：${esc(x.assigner)}${x.impact?`｜影響：${esc(x.impact)}`:""}</li>`).join("")}</ul>`:'<div class="empty">無</div>'}<h3>四、卡關事項</h3>${bl.length?`<ul>${bl.map(x=>`<li>${esc(x.title)}｜${esc(x.reason||"")} ${x.waiting?`｜等待：${esc(x.waiting)}`:""}</li>`).join("")}</ul>`:'<div class="empty">無</div>'}<h3>五、參與專案</h3>${projects.length?`<ul>${projects.map(x=>`<li>${esc(x.name)}｜${x.progress||0}%｜目前節點：${esc(x.current||"-")}</li>`).join("")}</ul>`:'<div class="empty">無</div>'}`;}
$("generate").onclick=generate;$("print").onclick=()=>window.print();$("copy").onclick=async()=>{let text=$("report").innerText;try{await navigator.clipboard.writeText(text);$("copy").textContent="已複製"}catch(e){alert("瀏覽器無法自動複製，請直接選取匯報文字。")}};load();
</script></body></html>
